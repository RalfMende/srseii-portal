<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Mobile Station Web App</title>
</head>
<body>
  <p>Forwarding to the Mobile Station Web App …</p>
  <p><a id="fallback-link" href="#">Falls die Weiterleitung nicht funktioniert, hier klicken.</a></p>
  <script>
    // Target port of the Mobile Station Web App is hardwired, host is determined at runtime.
    var target = "http://" + location.hostname + ":6020/";
    document.getElementById("fallback-link").href = target;
    location.replace(target);
  </script>
</body>
</html>
