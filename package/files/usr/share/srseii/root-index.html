<!doctype html>
<html lang="de">
<head>

    }
    main {
      max-width: 680px;
      margin: 4rem auto;
      padding: 1rem;
    }
    .box {
      background: #ffffff;
      border: 1px solid #d7d0c2;
      border-radius: 12px;
      padding: 1rem;

      margin-top: 0;
      font-size: 1.7rem;

      color: #4f5261;
    }
    .links {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;

    }

      text-decoration: none;
      border-radius: 8px;
      padding: 0.55rem 0.85rem;

      color: #1f2025;
      font-weight: 600;

  <main>
    <section class="box">
      <h1>SRSEII Portal</h1>

      <div class="links">
