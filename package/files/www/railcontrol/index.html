<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>RailControl</title>
</head>
<body>
  <p>Weiterleitung zu RailControl …</p>
  <p><a id="fallback-link" href="#">Falls die Weiterleitung nicht funktioniert, hier klicken.</a></p>
  <script>
    // Zielport von RailControl ist fest verdrahtet, Host wird zur Laufzeit ermittelt.
    var target = "http://" + location.hostname + ":8082/";
    document.getElementById("fallback-link").href = target;
    location.replace(target);
  </script>
</body>
</html>
